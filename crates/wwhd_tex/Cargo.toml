[package]
name = "wwhd_tex"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
image = "0.25.10"
image_dds = "0.7.2"
log = "0.4.35"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ureq = "2"
wiiu_swizzle = { path = "../../third_party/wiiu_swizzle" }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
